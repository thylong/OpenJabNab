[Config]
httpListener = true
httpApi = true
httpVioletApi = true
xmppListener = true
RealHttpRoot = /app/http-wrapper/
TTSRoot = /app/bin/
HttpRoot = ojn_local
HttpPluginsFolder = plugins
StandAloneAuthBypass = true
AllowAnonymousRegistration = true
AllowUserManageBunny = true
AllowUserManageZtamp = true
SessionTimeout = 1800
TTS = pico
MaxNumberOfBunnies = 64
MaxBurstNumberOfBunnies = 72
XmppTimeout = 60
XmppPingInterval = 30
XmppKeepAlive = true
UpdateDB = true
TrackBunnies = true
DatabaseUpdateInterval = 30

[Database]
Hostname = mysql
DBName = ojn
User = ojn
Pass = ojn
Port = 3306

[OpenJabNabServers]
PingServer = nabaztag.yourdomain.com
BroadServer = nabaztag.yourdomain.com
XmppServer = nabaztag.yourdomain.com
ListeningHttpPort = 8080
ListeningXmppPort = 5222

[Log]
LogFile = openjabnab.log
LogFileLevel = Debug
LogScreenLevel = Debug
DisplayCronLog = false

[TTS]
order = pico
