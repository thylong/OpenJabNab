<VirtualHost *:80>
    ServerName nabaztag.yourdomain.com
    ServerAlias localhost *.nabaztag.yourdomain.com
    DocumentRoot /var/www/html
    
    # Enable directory indexing for root
    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # Rewrite rules for OpenJabNab compatibility
    RewriteEngine On
    
    # Nabaztag bootcode endpoints (both direct and vl paths)
    RewriteRule ^/bc\.jsp$ /ojn_local/bootcode/bootcode.default [L]
    RewriteRule ^/vl/bc\.jsp$ /ojn_local/bootcode/bootcode.default [L]
    
    # Nabaztag locate endpoints
    RewriteRule ^/locate\.jsp$ /locate.php [L]
    RewriteRule ^/vl/locate\.jsp$ /vl/locate.php [L]
    
    # API endpoints - redirect to openjabnab.php
    RewriteRule ^/ojn_api /openjabnab.php [L]
    RewriteRule ^/ojn/ /openjabnab.php [L] 
    RewriteRule ^/vl /openjabnab.php [L]
    
    # Strip /openjabnab.php prefix and forward to openjabnab.php with clean path
    RewriteRule ^/openjabnab\.php/(.*)$ /openjabnab.php [E=CLEAN_PATH:/$1,L]
    
    # Admin panel
    <Directory /var/www/html/ojn_admin>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Deny access to sensitive files
    <FilesMatch "\.(ini|log|conf)$">
        Require all denied
    </FilesMatch>

    # Security headers
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"

    # Logging
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>