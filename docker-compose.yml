version: "3.9"
services:
  openjabnab:
    build: .
    image: openjabnab:latest
    container_name: openjabnab
    restart: unless-stopped
    environment:
      - OJN_CONFIG=/config/openjabnab.ini
    volumes:
      - ./server/openjabnab.ini:/config/openjabnab.ini:ro
      - ./logs:/app/logs
    ports:
      - "8080:8080"   # HTTP bridge TCP
      - "5222:5222"   # XMPP TCP
