# OpenJabNab Docker Compose Configuration
# Copy .env.example to .env and customize your domain settings

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: openjabnab_mysql
    environment:
      MYSQL_DATABASE: ojn
      MYSQL_USER: ojn
      MYSQL_PASSWORD: ojn
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # PHP Web Interface with Apache
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: openjabnab_web
    volumes:
      - ./http-wrapper:/var/www/html
      - ./docker/web/apache-config.conf:/etc/apache2/sites-available/000-default.conf
      - ./docker/web/ojn_local:/var/www/html/ojn_local
      - tts_files:/var/www/html/ojn_local/tts
    ports:
      - "80:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - DB_HOST=mysql
      - DB_NAME=ojn
      - DB_USER=ojn
      - DB_PASS=ojn
      - OJN_HTTP_HOST=${OJN_HTTP_HOST:-nabaztag.yourdomain.com}
      - OJN_DOMAIN=${OJN_DOMAIN:-nabaztag.yourdomain.com}
      - OJN_XMPP_HOST=${OJN_XMPP_HOST:-nabaztag.yourdomain.com}
      - OJN_HTTP_PORT=${OJN_HTTP_PORT:-8080}
      - OJN_XMPP_PORT=${OJN_XMPP_PORT:-5222}

  # OpenJabNab C++ Server
  openjabnab:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    container_name: openjabnab_server
    volumes:
      - ./server/conf:/app/conf
      - ./docker/server/openjabnab.ini:/app/bin/openjabnab.ini
      - ./http-wrapper:/app/http-wrapper
      - ./secrets:/app/secrets
      - tts_files:/app/bin/tts
    ports:
      - "8080:8080"
      - "5222:5222"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - DB_HOST=mysql
      - DB_NAME=ojn
      - DB_USER=ojn
      - DB_PASS=ojn
      - OJN_HTTP_HOST=${OJN_HTTP_HOST:-nabaztag.yourdomain.com}
      - OJN_DOMAIN=${OJN_DOMAIN:-nabaztag.yourdomain.com}
      - OJN_XMPP_HOST=${OJN_XMPP_HOST:-nabaztag.yourdomain.com}
      - OJN_HTTP_PORT=${OJN_HTTP_PORT:-8080}
      - OJN_XMPP_PORT=${OJN_XMPP_PORT:-5222}

volumes:
  mysql_data:
  tts_files:

networks:
  default:
    name: openjabnab_network
