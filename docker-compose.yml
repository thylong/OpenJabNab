services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: openjabnab_mysql
    environment:
      MYSQL_DATABASE: ojn
      MYSQL_USER: ojn
      MYSQL_PASSWORD: ojn
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # PHP Web Interface with Apache
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: openjabnab_web
    volumes:
      - ./http-wrapper:/var/www/html
      - ./docker/web/apache-config.conf:/etc/apache2/sites-available/000-default.conf
      - ./docker/web/ojn_local:/var/www/html/ojn_local
    ports:
      - "80:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - DB_HOST=mysql
      - DB_NAME=ojn
      - DB_USER=ojn
      - DB_PASS=ojn

  # OpenJabNab C++ Server
  openjabnab:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    container_name: openjabnab_server
    volumes:
      - ./server/conf:/app/conf
      - ./docker/server/openjabnab.ini:/app/bin/openjabnab.ini
      - ./http-wrapper:/app/http-wrapper
    ports:
      - "8080:8080"
      - "5222:5222"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - DB_HOST=mysql
      - DB_NAME=ojn
      - DB_USER=ojn
      - DB_PASS=ojn

  # phpMyAdmin for database management (optional)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: openjabnab_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ojn
      PMA_PASSWORD: ojn
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  default:
    name: openjabnab_network