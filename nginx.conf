server {
  listen 80;
  server_name _;

  root /var/www/html;
  index index.php;

  # Map bc.jsp to bootcode (original behavior)
  if ($uri ~* "/vl/bc.jsp$") {
    rewrite ^ /ojn_local/bootcode/bootcode.default last;
  }
  location = /bc.jsp {
    try_files /ojn_local/bootcode/bootcode.default =404;
  }

  # Redirect non-existent files to openjabnab.php (handled via try_files below)

  location / {
    try_files $uri /openjabnab.php;
  }

  location /ojn_admin {
    index index.php;
    autoindex off;
  }

  location ~ \.htaccess { deny all; }

  location = /favicon.ico {
    access_log off;
    return 204;
  }

  location ~* ^.+\.(jpg|jpeg|gif|css|png|js|xml)$ {
    expires 30d;
    access_log off;
  }

  # PHP-FPM upstream
  location ~ \.php$ {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param SERVER_NAME $http_host;
    fastcgi_ignore_client_abort on;
    fastcgi_pass php-fpm:9000;
  }
}
