version: "3.9"
services:
  openjabnab:
    build: .
    ports:
      - "5222:5222"
    image: openjabnab:latest
    container_name: ojn-server
    restart: unless-stopped
    environment:
      - OJN_CONFIG=/config/openjabnab.ini
    volumes:
      - ./server/openjabnab.ini:/config/openjabnab.ini:ro
      - ./plugins:/config/plugins
    # expose TCP bridge (custom protocol) and XMPP
    networks: [ojn]

  php-fpm:
    image: php:8.2-fpm
    container_name: ojn-php-fpm
    restart: unless-stopped
    volumes:
      - ./http-wrapper:/var/www/html:ro
    networks: [ojn]

  nginx:
    image: nginx:stable
    container_name: ojn-nginx
    depends_on:
      - php-fpm
      - openjabnab
    ports:
      - "80:80"
    volumes:
      - ./http-wrapper:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [ojn]

networks:
  ojn:
    driver: bridge
