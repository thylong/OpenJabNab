[Config]
httpListener = false
httpApi = true
httpVioletApi = true
xmppListener = true
HttpNativeListener = true
NativeHttpPort = 80
RealHttpRoot = /app/http-wrapper/ojn_local/
HttpRoot = ojn_local
HttpPluginsFolder = plugins
StandAloneAuthBypass = false
AllowAnonymousRegistration=false
AllowUserManageBunny=false
AllowUserManageZtamp=false
SessionTimeout=300
TTS=google
MaxNumberOfBunnies=64
MaxBurstNumberOfBunnies=72

[Auth]
Bypass=true

[OpenJabNabServers]
PingServer=r.nabaztag.com
BroadServer=r.nabaztag.com
XmppServer=r.nabaztag.com
ListeningHttpPort=8080
ListeningXmppPort=5222

[Log]
LogFile=/dev/stdout
LogFileLevel=Info
LogScreenLevel=Info
NetworkDump=true
DisplayCronLog=false

[TTS]
RateLimitRPS = 5
Workers = 2
TimeoutMs = 15000
MaxRetries = 2
BackoffMs = 200
